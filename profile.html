<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Settings - Archive Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="glass">
        <div class="logo">MY PROFILE</div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="project.html">Repository</a></li>
            <li><a href="media.html">News</a></li>
            <li><a href="profile.html" class="active">Settings</a></li>
            <li><a href="#" id="btnLogout">Logout</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 800px;">
        
        <div id="profile-card-container" class="glass card" style="padding: 0; overflow: hidden; margin-bottom: 30px;">
            <div id="display-banner" style="height:180px; background-color: #333; background-position: center; background-size: cover;"></div>
            
            <div style="padding: 0 20px 30px; text-align: center; position: relative;">
                <div id="avatar-frame" style="display: inline-block; margin-top: -60px; border-radius: 50%; padding: 5px;">
                    <img id="display-avatar" src="https://ui-avatars.com/api/?name=User" 
                         style="width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--glass-bg); object-fit: cover; background: #222;">
                </div>
                
                <h2 id="display-name" style="margin-top: 15px; font-size: 1.8rem;">Loading...</h2>
                <div style="margin: 10px 0;">
                    <span id="user-role-badge" class="badge">MEMBER</span>
                    <span id="user-credits" style="color: #10b981; font-weight: bold; margin-left: 10px;">$0</span>
                </div>
                
                <p id="display-bio" style="color: #ccc; font-style: italic; margin-bottom: 15px;">"Bio belum diisi."</p>
                
                <div id="display-skills" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;"></div>
            </div>
        </div>

        <div class="glass card">
            <h3 style="margin-bottom: 20px; color: var(--accent);">
                <i class="fas fa-user-edit"></i> Edit Identity
            </h3>
            
            <form id="profileForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Nama Tampilan</label>
                        <input type="text" id="edit-name" placeholder="Nama Anda" required>
                    </div>
                    <div>
                        <label>Nomor HP</label>
                        <input type="text" id="edit-phone" placeholder="0812...">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                    <div>
                        <label>Foto Profil (URL/Link)</label>
                        <input type="url" id="edit-avatar-url" placeholder="https://...">
                    </div>
                    <div>
                        <label>Banner Profil / GIF (URL)</label>
                        <input type="url" id="edit-banner-url" placeholder="https://...">
                    </div>
                </div>

                <div style="margin-top: 15px;">
                    <label>Link Portofolio (Pamerkan karya Anda)</label>
                    <input type="url" id="edit-portfolio" placeholder="https://github.com/username">
                </div>

                <div style="margin-top: 15px;">
                    <label>Bio / Motto</label>
                    <textarea id="edit-bio" rows="2" placeholder="Tentang diri anda..."></textarea>
                </div>

                <div style="margin-top: 15px;">
                    <label>Keahlian (Pisahkan dengan koma)</label>
                    <input type="text" id="edit-skills" placeholder="Contoh: HTML, CSS, JavaScript">
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 20px; width: 100%; padding: 12px;">
                    <i class="fas fa-save"></i> Simpan Perubahan
                </button>
            </form>
        </div>

        <div class="glass card" style="margin-top: 30px; border: 1px solid #ffd70033;">
            <h3 style="color: #ffd700; margin-bottom: 10px;">
                <i class="fas fa-gem"></i> Premium Decoration
            </h3>
            <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 20px;">
                Tingkatkan tampilan profilmu. Harga: <b>$100 Kredit</b> per item.
            </p>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">
                <button onclick="buyDecoration('neon')" class="btn-shop deco-neon-preview">Neon Discord</button>
                <button onclick="buyDecoration('gold')" class="btn-shop deco-gold-preview">Gold VIP</button>
                <button onclick="buyDecoration('galaxy')" class="btn-shop deco-galaxy-preview">Galaxy Animated</button>
                <button onclick="buyDecoration('emerald')" class="btn-shop deco-emerald-preview">Emerald Knight</button>
            </div>
        </div>
    </div>

    <script type="module" src="App.js"></script>
</body>
</html>
