<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Settings - Archive Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="glass">
        <div class="logo">MY PROFILE</div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="project.html">Repository</a></li>
            <li><a href="media.html">News</a></li>
            <li><a href="profile.html" class="active">Settings</a></li>
            <li><a href="#" id="btnLogout">Logout</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 800px;">
        
        <div id="profile-card-container" class="glass card" style="padding: 0; overflow: hidden; margin-bottom: 30px;">
            <div id="display-banner" style="height:180px; background-color: #333; background-position: center; background-size: cover;"></div>
            
            <div style="padding: 0 20px 30px; text-align: center; position: relative;">
                <div id="avatar-frame" class="avatar-wrapper" style="display: inline-block; margin-top: -60px; border-radius: 50%; padding: 5px;">
                    <img id="display-avatar" src="https://ui-avatars.com/api/?name=User" 
                         style="width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--glass-bg); object-fit: cover; background: #222;">
                </div>
                
                <h2 id="display-name" style="margin-top: 15px; font-size: 1.8rem;">Loading...</h2>
                
                <div id="display-uid" style="font-family: monospace; font-size: 0.75rem; color: var(--accent); margin-top: 5px; opacity: 0.8;">UID: Loading...</div>

                <div style="margin: 10px 0;">
                    <span id="user-role-badge" class="badge">MEMBER</span>
                    <span id="user-credits" style="color: #10b981; font-weight: bold; margin-left: 10px;">$0</span>
                </div>
                
                <p id="display-bio" style="color: #ccc; font-style: italic; margin-bottom: 15px;">"Bio belum diisi."</p>
                <div id="display-skills" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;"></div>
            </div>
        </div>

        <div class="glass card">
            <h3 style="margin-bottom: 20px; color: var(--accent);"><i class="fas fa-user-edit"></i> Edit Identity</h3>
            <form id="profileForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <input type="text" id="edit-name" placeholder="Nama Tampilan" required>
                    <input type="text" id="edit-phone" placeholder="Nomor HP">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                    <input type="url" id="edit-avatar-url" placeholder="Link Foto Profil (URL)">
                    <input type="url" id="edit-banner-url" placeholder="Link Banner / GIF (URL)">
                </div>
                <input type="url" id="edit-portfolio" placeholder="Link Portofolio (Github/Linktree)" style="margin-top:15px;">
                <textarea id="edit-bio" rows="2" placeholder="Bio / Motto..." style="margin-top:15px;"></textarea>
                <input type="text" id="edit-skills" placeholder="Keahlian (Pisahkan dengan koma)" style="margin-top:15px;">

                <button type="submit" class="btn btn-primary" style="margin-top: 20px; width: 100%;">Simpan Perubahan</button>
            </form>
        </div>

        <div id="admin-panel" class="glass card" style="display: none; margin-top: 30px; border: 1px solid #10b981;">
            <h3 style="color: #10b981;"><i class="fas fa-money-bill-wave"></i> Owner: Top Up Credits</h3>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="topup-uid" placeholder="User ID (UID) Member" style="flex: 2; margin-bottom: 0;">
                <input type="number" id="topup-amount" placeholder="Jumlah ($)" style="flex: 1; margin-bottom: 0;">
            </div>
            <button onclick="window.addCreditsToMember()" class="btn btn-primary" style="margin-top: 15px; width: 100%; background: #10b981;">Kirim Kredit</button>
        </div>

        <div class="glass card" style="margin-top: 30px;">
            <h3 style="color: #ffd700;"><i class="fas fa-gem"></i> Premium Decoration</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 15px;">
                <button onclick="buyDecoration('neon')" class="btn-shop">Neon Blue</button>
                <button onclick="buyDecoration('gold')" class="btn-shop">Gold VIP</button>
                <button onclick="buyDecoration('galaxy')" class="btn-shop">Galaxy Animated</button>
                <button onclick="buyDecoration('emerald')" class="btn-shop">Emerald Knight</button>
            </div>
        </div>
    </div>
    <script type="module" src="App.js"></script>
</body>
</html>
