<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - My Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass auth-box">
            <h2 style="text-align: center; margin-bottom: 20px;">Lab Access</h2>
            
            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@mylab.com" required>
                
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••" required>
                
                <div style="text-align: right; margin-bottom: 20px;">
                    <a href="#" id="forgot-password-link" style="color: var(--text-secondary); font-size: 0.8rem; text-decoration: none;">Lupa Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Unlock System</button>
            </form>

            <div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Belum punya akses Lab? <br>
                    <a href="register.html" style="color: var(--accent); font-weight: bold; text-decoration: none; margin-top: 5px; display: inline-block;">
                        Buat Akun Member &rarr;
                    </a>
                </p>
            </div>

            <p id="error-msg" style="color: #ef4444; margin-top: 10px; text-align: center; font-size: 0.9rem;"></p>
        </div>
    </div>
    <script type="module" src="App.js"></script>
     <script src="main.js"></script>
</body>
</html>
