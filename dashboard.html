<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lab Dashboard - Archive Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="glass">
        <div class="logo">ARCHIVE LAB.</div>
        <ul>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="project.html">Repository</a></li>
            <li><a href="media.html">News</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="#" id="btnLogout">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div id="user-role-badge" class="badge">LOADING...</div>
            <div id="user-credits" style="color: #10b981; font-weight: bold; font-size: 1.2rem;">$0</div>
        </div>

        <div id="admin-panel" class="glass card" style="display: none; border: 1px solid var(--accent); margin-bottom: 30px;">
            <h3><i class="fas fa-crown"></i> OWNER CONTROL CENTER</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
                <form id="form-project-owner">
                    <input type="text" id="own-title" placeholder="Nama Project" required>
                    <textarea id="own-desc" placeholder="Deskripsi Singkat..." required></textarea>
                    <select id="own-type">
                        <option value="github">🔗 GitHub Link</option>
                        <option value="file">📦 Direct File/ZIP</option>
                    </select>
                    <select id="own-status">
                        <option value="public">🌍 Public (Unlocked)</option>
                        <option value="private">🔒 Private (Locked)</option>
                    </select>
                    <input type="url" id="own-download" placeholder="URL Link Project" required>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Deploy Free</button>
                </form>
                <div style="border-left: 1px solid rgba(255,255,255,0.1); padding-left: 20px;">
                    <h4>Moderasi Member</h4>
                    <input type="text" id="target-uid" placeholder="Masukkan User ID (UID)">
                    <button onclick="ownerAction('warn')" class="btn" style="width:100%; margin-bottom:10px;">Beri Warning</button>
                    <button onclick="ownerAction('ban')" class="btn" style="width:100%; background:#ef4444;">BAN MEMBER</button>
                </div>
            </div>
        </div>

        <div id="member-panel" class="glass card" style="display: none; border-left: 4px solid #10b981;">
            <h3><i class="fas fa-rocket"></i> MEMBER DEPLOY ($50)</h3>
            <form id="form-project-member" style="margin-top:15px;">
                <input type="text" id="mem-title" placeholder="Project Name" required>
                <textarea id="mem-desc" placeholder="Deskripsi..."></textarea>
                <input type="url" id="mem-download" placeholder="Link ZIP/Github" required>
                <button type="submit" class="btn btn-primary" style="background:#10b981; width:100%;">Bayar $50 & Post</button>
            </form>
        </div>

        <div class="grid-container">
            <div>
                <h2>Repository</h2>
                <div id="project-list"></div>
            </div>
            <div>
                <h2>Informasi Terbaru</h2>
                <div id="news-list"></div>
            </div>
        </div>
    </div>

    <script type="module" src="App.js"></script>
</body>
</html>
