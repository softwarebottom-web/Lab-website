<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Media Center - Archive Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="glass">
        <div class="logo">ARCHIVE LAB.</div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="project.html">Repository</a></li>
            <li><a href="media.html" class="active">News</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="#" id="btnLogout">Logout</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 850px;">
        <header style="text-align: center; margin: 30px 0;">
            <h1><i class="fas fa-bullhorn"></i> Lab Media Center</h1>
            <p style="color: var(--text-secondary);">Pusat informasi dan pembaruan sistem berkala.</p>
        </header>

        <div id="admin-panel" class="glass card" style="display: none; border: 1px solid #facc15; margin-bottom: 30px;">
            <h3 style="color: #facc15; margin-bottom: 15px;"><i class="fas fa-paper-plane"></i> Broadcast New Information</h3>
            <form id="form-news">
                <input type="text" id="news-title" placeholder="Judul Pengumuman" required>
                <textarea id="news-content" rows="3" placeholder="Isi pesan informasi..." required></textarea>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label style="font-size: 0.8rem; color: #aaa;">Tipe Berita</label>
                        <select id="news-type" style="width: 100%;">
                            <option value="general">ℹ️ Informasi Umum</option>
                            <option value="important">⚠️ PENTING (Bisa Diklik)</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; color: #aaa;">Tautan Luar (Opsional)</label>
                        <input type="url" id="news-link" placeholder="https://t.me/yourgroup">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; background: #facc15; color: #000; font-weight: bold;">
                    Kirim Siaran Sekarang
                </button>
            </form>
        </div>

        <div id="media-news-list">
            <div style="text-align: center; padding: 40px;">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--accent);"></i>
                <p style="margin-top: 10px;">Menghubungkan ke satelit informasi...</p>
            </div>
        </div>
    </div>

    <div id="news-modal" class="modal-overlay" style="display:none;" onclick="this.style.display='none'">
        <div class="glass modal-box" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="modal-title" style="color: #facc15; margin: 0;">Judul Berita</h2>
                <span style="cursor: pointer; font-size: 1.5rem;" onclick="document.getElementById('news-modal').style.display='none'">&times;</span>
            </div>
            <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                <p id="modal-desc" style="line-height: 1.7; color: #ddd; white-space: pre-wrap;"></p>
            </div>
            <div style="margin-top: 25px;">
                <a id="modal-link" href="#" target="_blank" class="btn btn-primary" style="display: block; text-align: center; width: 100%;">
                    <i class="fas fa-external-link-alt"></i> Buka Tautan Terkait
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="App.js"></script>
</body>
</html>
