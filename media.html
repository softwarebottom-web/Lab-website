<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Media & Broadcast - Archive Lab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="glass">
        <div class="logo">BROADCAST</div>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="project.html">Repository</a></li>
            <li><a href="media.html" class="active">News</a></li>
            <li><a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a></li>
            <li><a href="#" id="btnLogout">Logout</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 800px;">
        <h2 style="margin-bottom: 30px; border-bottom: 2px solid var(--accent); padding-bottom: 10px;">
            <i class="fas fa-satellite-dish"></i> Live Broadcast News
        </h2>
        
        <div id="media-news-list">
            <div style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent);"></i>
                <p style="margin-top: 15px; color: #aaa;">Menghubungkan ke pemancar data...</p>
            </div>
        </div>
    </div>

    <div id="news-modal" class="modal-overlay">
        <div class="glass modal-box">
            <span class="close-modal" onclick="document.getElementById('news-modal').style.display='none'">&times;</span>
            <h2 id="modal-title" style="color: var(--accent); margin-bottom: 15px;">Judul Info</h2>
            <div style="border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px;"></div>
            <p id="modal-desc" style="line-height: 1.6; margin-bottom: 25px; color: #ddd;">Deskripsi lengkap...</p>
            <a id="modal-link" href="#" target="_blank" class="btn btn-primary" style="width: 100%; text-align: center;">
                <i class="fas fa-external-link-alt"></i> Buka Tautan Terkait
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Archive Lab. System Broadcast v2.0</p>
    </footer>

    <script src="main.js"></script>
    <script type="module" src="App.js"></script>
</body>
</html>
