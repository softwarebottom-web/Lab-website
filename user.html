<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>User Profile - Visitor Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 700px; margin-top: 50px;">
        <div id="v-banner" style="height:200px; border-radius:15px; background-size:cover; background-position:center;"></div>
        <div class="glass card" style="text-align:center; margin-top:-50px; padding-top:60px;">
            <div id="v-frame" style="display:inline-block; border-radius:50%; padding:5px;">
                <img id="v-avatar" src="" style="width:120px; height:120px; border-radius:50%; border:5px solid #222;">
            </div>
            <h1 id="v-name" style="margin-top:15px;">Loading...</h1>
            <p id="v-bio" style="font-style:italic; color:#aaa; margin:10px 0;"></p>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:20px 0;">
            <p><b>Expertise:</b> <span id="v-skills"></span></p>
            <a id="v-portfolio" href="#" target="_blank" class="btn" style="margin-top:20px; display:inline-block;">View Portfolio</a>
            <br><br>
            <button onclick="history.back()" class="btn-primary">Back to Repository</button>
        </div>
    </div>
    <script type="module" src="App.js"></script>
</body>
</html>
